name: RouterOS test image

on:
  workflow_dispatch:
    inputs:
      routeros_version:
        description: RouterOS CHR version to build, e.g. 7.24.5
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .github/docker/routeros
          build-args: ROUTEROS_VERSION=${{ inputs.routeros_version }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/routeros:v${{ inputs.routeros_version }}
